name: Android package
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'HTTPS RadioMate server origin (no path)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build preview and optional signed release
        working-directory: android
        env:
          SERVER_URL: ${{ inputs.server_url }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p ../output/android
          ./gradlew :app:assembleDebug :app:lintDebug "-PserverUrl=$SERVER_URL" --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../output/android/RadioMate-preview.apk
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            trap 'rm -f signing.properties release-upload.jks' EXIT
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release-upload.jks
            python3 - <<'PY'
          import os
          def esc(s):
              return s.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          with open('signing.properties', 'w') as f:
              f.write('storeFile=release-upload.jks\n')
              for prop, env in [('storePassword','STORE_PASSWORD'), ('keyAlias','KEY_ALIAS'), ('keyPassword','KEY_PASSWORD')]:
                  f.write(prop+'='+esc(os.environ[env])+'\n')
          PY
            ./gradlew :app:assembleRelease :app:bundleRelease :app:lintRelease "-PserverUrl=$SERVER_URL" --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../output/android/RadioMate.apk
            cp app/build/outputs/bundle/release/app-release.aab ../output/android/RadioMate.aab
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RadioMate-Android
          path: output/android/
          if-no-files-found: error
