<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700"><rect width="1200" height="700" fill="#fff8fc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#a24a7d"/></marker></defs><rect x="50" y="35" width="500" height="150" rx="15" fill="#f8e0ed" stroke="#bd74a0"/><text x="74" y="79" font-family="Malgun Gothic" font-size="24" fill="#79305e">1. 지역과 종류 선택</text><text x="74" y="125" font-family="Malgun Gothic" font-size="17" fill="#68455e">17개 시·도 · 136개 지역 / 음식 20종 · 카페 5종</text><path d="M550 110h90" stroke="#a24a7d" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="35" width="500" height="150" rx="15" fill="#f8e0ed" stroke="#bd74a0"/><text x="674" y="79" font-family="Malgun Gothic" font-size="24" fill="#79305e">2. 입력과 키 확인</text><text x="674" y="125" font-family="Malgun Gothic" font-size="17" fill="#68455e">잘못된 입력 → 오류 / 키 미설정 → 지도 링크</text><path d="M900 185v35H35v35h265" fill="none" stroke="#a24a7d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="255" width="500" height="150" rx="15" fill="#f8e0ed" stroke="#bd74a0"/><text x="74" y="299" font-family="Malgun Gothic" font-size="24" fill="#79305e">3. 캐시와 진행 중 요청 확인</text><text x="74" y="345" font-family="Malgun Gothic" font-size="17" fill="#68455e">5분 캐시 또는 같은 요청 병합</text><path d="M550 330h90" stroke="#a24a7d" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="255" width="500" height="150" rx="15" fill="#f8e0ed" stroke="#bd74a0"/><text x="674" y="299" font-family="Malgun Gothic" font-size="24" fill="#79305e">4. 네이버 기본 검색</text><text x="674" y="345" font-family="Malgun Gothic" font-size="17" fill="#68455e">요청당 display=5, start=1 / 실패 시 전체 오류</text><path d="M900 405v35H35v35h265" fill="none" stroke="#a24a7d" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="475" width="500" height="150" rx="15" fill="#f8e0ed" stroke="#bd74a0"/><text x="74" y="519" font-family="Malgun Gothic" font-size="24" fill="#79305e">5. 확장 선택 시 추가 검색</text><text x="74" y="565" font-family="Malgun Gothic" font-size="17" fill="#68455e">서로 다른 검색어 최대 2개 / 실패는 부분 결과</text><path d="M550 550h90" stroke="#a24a7d" stroke-width="3" marker-end="url(#arrow)"/><rect x="650" y="475" width="500" height="150" rx="15" fill="#f8e0ed" stroke="#bd74a0"/><text x="674" y="519" font-family="Malgun Gothic" font-size="24" fill="#79305e">6. 업체명과 주소로 중복 제외</text><text x="674" y="565" font-family="Malgun Gothic" font-size="17" fill="#68455e">주소가 다른 지점 보존 / 최대 15곳 표시</text></svg>