<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2240" viewBox="0 0 1600 2240"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9D688D"/></marker></defs><rect width="1600" height="2240" fill="white"/><g font-family="Malgun Gothic,sans-serif"><text x="800" y="85" text-anchor="middle" font-size="44" fill="#493247">08  Android 외부 로그인과 세션 교환</text><text x="800" y="135" text-anchor="middle" font-size="24" fill="#493247">RADIO MATE  |  구현 기준 2026.11.18</text><rect x="170" y="210" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="273" text-anchor="middle" font-size="28" fill="#493247">앱 메뉴에서 DJ 계정 연결 선택</text><path d="M650,322 L650,373" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="373" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="417" text-anchor="middle" font-size="28" fill="#493247">앱이 검증값 생성 · 기기에만 보관</text><text x="650" y="455" text-anchor="middle" font-size="28" fill="#493247">SHA256 challenge로 외부 브라우저 열기</text><path d="M650,485 L650,536" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="536" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="580" text-anchor="middle" font-size="28" fill="#493247">서버 OAuth state 쿠키 설정</text><text x="650" y="618" text-anchor="middle" font-size="28" fill="#493247">DJ가 Spoon 계정 로그인과 권한 동의</text><path d="M650,648 L650,699" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,699 1130,755.0 650,811 170,755.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,755 L1190,755" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="783" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="699" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="744" text-anchor="middle" font-size="23" fill="#493247">로그인 재시작 안내</text><text x="610" y="840" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="762" text-anchor="middle" font-size="28" fill="#493247">OAuth state와 쿠키가 일치하고 유효한가?</text><path d="M650,811 L650,862" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="862" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="925" text-anchor="middle" font-size="28" fill="#493247">서버가 DJ 연결 · Spoon 토큰은 서버 보관</text><path d="M650,974 L650,1025" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1025" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1088" text-anchor="middle" font-size="28" fill="#493247">서버가 2분짜리 일회용 앱 코드 발급</text><path d="M650,1137 L650,1188" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1188" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1232" text-anchor="middle" font-size="28" fill="#493247">사용자가 앱으로 돌아가기 선택</text><text x="650" y="1270" text-anchor="middle" font-size="28" fill="#493247">앱이 코드와 원래 검증값을 HTTPS 전송</text><path d="M650,1300 L650,1351" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,1351 1130,1407.0 650,1463 170,1407.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1407 L1190,1407" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1435" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1351" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1396" text-anchor="middle" font-size="23" fill="#493247">교환 거부</text><text x="1365" y="1434" text-anchor="middle" font-size="23" fill="#493247">앱 연결 다시 시작</text><text x="610" y="1492" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1414" text-anchor="middle" font-size="28" fill="#493247">코드 유효 · 검증값 일치 · 미사용인가?</text><path d="M650,1463 L650,1514" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1514" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1577" text-anchor="middle" font-size="28" fill="#493247">일회용 코드 소모 · HttpOnly 세션 발급</text><path d="M650,1626 L650,1677" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1677" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1740" text-anchor="middle" font-size="28" fill="#493247">앱 WebView에 서버 세션 쿠키 저장</text><path d="M650,1789 L650,1840" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1840" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1903" text-anchor="middle" font-size="28" fill="#493247">연결한 DJ 대시보드 표시</text><rect x="70" y="2070" width="1460" height="112" rx="12" fill="#FFF8ED" stroke="#B59BAF" stroke-width="2"/><text x="800" y="2110" text-anchor="middle" font-size="24" fill="#493247">Spoon 비밀키·토큰은 APK에 포함하지 않습니다. 일회용 로그인 코드는 SQL 테이블이 아닌 메모리에 보관합니다.</text><text x="800" y="2210" text-anchor="middle" font-size="23" fill="#493247">8 / 9  ·  마름모: 조건 판단  |  아래: 예  |  오른쪽: 아니요</text></g></svg>