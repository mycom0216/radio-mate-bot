00 170,1244.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1244 L1190,1244" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1272" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1188" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1233" text-anchor="middle" font-size="23" fill="#493247">최초 재생 버튼 클릭</text><text x="1365" y="1271" text-anchor="middle" font-size="23" fill="#493247">또는 재생 오류 확인</text><text x="610" y="1329" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1251" text-anchor="middle" font-size="28" fill="#493247">브라우저 재생이 허용되는가?</text><path d="M650,1300 L650,1351" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1351" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1414" text-anchor="middle" font-size="28" fill="#493247">선택된 신청곡 재생</text><path d="M650,1463 L650,1514" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1514" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1577" text-anchor="middle" font-size="28" fill="#493247">곡 종료 시 완료 처리</text><path d="M650,1626 L650,1677" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,1677 1130,1733.0 650,1789 170,1733.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1733 L1190,1733" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1761" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1677" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1722" text-anchor="middle" font-size="23" fill="#493247">현재 재생 종료</text><text x="610" y="1818" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1740" text-anchor="middle" font-size="28" fill="#493247">자동 다음곡 설정과 대기곡이 있는가?</text><path d="M650,1789 L650,1840" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1840" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1903" text-anchor="middle" font-size="28" fill="#493247">다음 대기곡 선택 → 영상 확인 단계 반복</text><rect x="70" y="2070" width="1460" height="112" rx="12" fill="#FFF8ED" stroke="#B59BAF" stroke-width="2"/><text x="800" y="2110" text-anchor="middle" font-size="24" fill="#493247">닫힌 모바일 브라우저에서 YouTube 재생을 시작하거나 스푼으로 자동 송출할 수는 없습니다.</text><text x="800" y="2210" text-anchor="middle" font-size="23" fill="#493247">2 / 9  ·  마름모: 조건 판단  |  아래: 예  |  오른쪽: 아니요</text></g></svg>