<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2240" viewBox="0 0 1600 2240"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9D688D"/></marker></defs><rect width="1600" height="2240" fill="white"/><g font-family="Malgun Gothic,sans-serif"><text x="800" y="85" text-anchor="middle" font-size="44" fill="#493247">05  청취 보상과 애청지수</text><text x="800" y="135" text-anchor="middle" font-size="24" fill="#493247">RADIO MATE  |  구현 기준 2026.11.18</text><rect x="170" y="210" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="273" text-anchor="middle" font-size="28" fill="#493247">약 1분 간격으로 현재 청취자 목록 조회</text><path d="M650,322 L650,373" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,373 1130,429.0 650,485 170,429.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,429 L1190,429" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="457" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="373" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="418" text-anchor="middle" font-size="23" fill="#493247">이번 구간 적립 생략</text><text x="1365" y="456" text-anchor="middle" font-size="23" fill="#493247">기준 스냅샷 초기화</text><text x="610" y="514" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="436" text-anchor="middle" font-size="28" fill="#493247">모든 페이지 조회에 성공했는가?</text><path d="M650,485 L650,536" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,536 1130,592.0 650,648 170,592.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,592 L1190,592" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="620" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="536" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="581" text-anchor="middle" font-size="23" fill="#493247">적립 없이 다음 조회 대기</text><text x="610" y="677" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="599" text-anchor="middle" font-size="28" fill="#493247">방송 중이며 청취 보상 설정이 켜져 있는가?</text><path d="M650,648 L650,699" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,699 1130,755.0 650,811 170,755.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,755 L1190,755" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="783" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="699" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="744" text-anchor="middle" font-size="23" fill="#493247">연속 청취 기준만 설정</text><text x="1365" y="782" text-anchor="middle" font-size="23" fill="#493247">이번 구간 시간은 미적립</text><text x="610" y="840" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="762" text-anchor="middle" font-size="28" fill="#493247">이전 조회에도 존재하고 간격이 90초 이내인가?</text><path d="M650,811 L650,862" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="862" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="925" text-anchor="middle" font-size="28" fill="#493247">유효 청취 시간 누적 · 애청지수 반영</text><path d="M650,974 L650,1025" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,1025 1130,1081.0 650,1137 170,1081.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1081 L1190,1081" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1109" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1025" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1070" text-anchor="middle" font-size="23" fill="#493247">시간 누적 계속</text><text x="610" y="1166" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1088" text-anchor="middle" font-size="28" fill="#493247">5분 보상 구간을 채웠는가?</text><path d="M650,1137 L650,1188" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,1188 1130,1244.0 650,1300 170,1244.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1244 L1190,1244" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1272" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1188" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1233" text-anchor="middle" font-size="23" fill="#493247">복권 추가 지급 없이</text><text x="1365" y="1271" text-anchor="middle" font-size="23" fill="#493247">지수·안내는 계속</text><text x="610" y="1329" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1251" text-anchor="middle" font-size="28" fill="#493247">오늘 청취 복권 지급이 100장 미만인가?</text><path d="M650,1300 L650,1351" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1351" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1414" text-anchor="middle" font-size="28" fill="#493247">남은 일일 한도 안에서 복권 지급</text><path d="M650,1463 L650,1514" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,1514 1130,1570.0 650,1626 170,1570.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1570 L1190,1570" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1598" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1514" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1559" text-anchor="middle" font-size="23" fill="#493247">채팅 안내 생략</text><text x="610" y="1655" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1577" text-anchor="middle" font-size="28" fill="#493247">지수 안내 조건 충족 · 조용 모드 해제?</text><path d="M650,1626 L650,1677" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1677" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1740" text-anchor="middle" font-size="28" fill="#493247">여러 사용자 안내를 길이 제한 내 묶어 전송</text><path d="M650,1789 L650,1840" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1840" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1903" text-anchor="middle" font-size="28" fill="#493247">다음 조회 대기 · 채팅 활동 점수도 별도 반영</text><rect x="70" y="2070" width="1460" height="112" rx="12" fill="#FFF8ED" stroke="#B59BAF" stroke-width="2"/><text x="800" y="2110" text-anchor="middle" font-size="24" fill="#493247">청취 시간은 조회 간격으로 추정합니다. 라디오메이트 애청지수는 스푼 공식 애청온도와 다릅니다.</text><text x="800" y="2210" text-anchor="middle" font-size="23" fill="#493247">5 / 9  ·  마름모: 조건 판단  |  아래: 예  |  오른쪽: 아니요</text></g></svg>