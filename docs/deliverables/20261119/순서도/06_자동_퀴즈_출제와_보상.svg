<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2240" viewBox="0 0 1600 2240"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9D688D"/></marker></defs><rect width="1600" height="2240" fill="white"/><g font-family="Malgun Gothic,sans-serif"><text x="800" y="85" text-anchor="middle" font-size="44" fill="#493247">06  자동 퀴즈 출제와 보상</text><text x="800" y="135" text-anchor="middle" font-size="24" fill="#493247">RADIO MATE  |  구현 기준 2026.11.18</text><rect x="170" y="210" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="273" text-anchor="middle" font-size="28" fill="#493247">자동 퀴즈 주기 확인</text><path d="M650,322 L650,373" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,373 1130,429.0 650,485 170,429.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,429 L1190,429" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="457" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="373" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="418" text-anchor="middle" font-size="23" fill="#493247">출제 대기</text><text x="610" y="514" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="436" text-anchor="middle" font-size="28" fill="#493247">방송 중 · 자동 출제 ON · 조용 모드 OFF?</text><path d="M650,485 L650,536" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,536 1130,592.0 650,648 170,592.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,592 L1190,592" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="620" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="536" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="581" text-anchor="middle" font-size="23" fill="#493247">기존 퀴즈 유지</text><text x="1365" y="619" text-anchor="middle" font-size="23" fill="#493247">또는 출제 대기</text><text x="610" y="677" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="599" text-anchor="middle" font-size="28" fill="#493247">출제 간격 경과 · 진행 중 퀴즈 없음?</text><path d="M650,648 L650,699" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="699" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="762" text-anchor="middle" font-size="28" fill="#493247">문제 선택 · 초성 · 힌트 생성</text><path d="M650,811 L650,862" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,862 1130,918.0 650,974 170,918.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,918 L1190,918" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="946" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="862" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="907" text-anchor="middle" font-size="23" fill="#493247">재시도 정책 적용</text><text x="1365" y="945" text-anchor="middle" font-size="23" fill="#493247">정답 판정 시작 안 함</text><text x="610" y="1003" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="925" text-anchor="middle" font-size="28" fill="#493247">문제 채팅 전송 성공이 확인되었는가?</text><path d="M650,974 L650,1025" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1025" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1088" text-anchor="middle" font-size="28" fill="#493247">퀴즈 활성화 · 제한시간 설정</text><path d="M650,1137 L650,1188" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,1188 1130,1244.0 650,1300 170,1244.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1244 L1190,1244" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1272" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1188" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1233" text-anchor="middle" font-size="23" fill="#493247">시간 전에는 응답 대기</text><text x="1365" y="1271" text-anchor="middle" font-size="23" fill="#493247">시간 만료 시 아래 처리</text><text x="610" y="1329" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1251" text-anchor="middle" font-size="28" fill="#493247">제한시간 안에 첫 정답이 들어왔는가?</text><path d="M650,1300 L650,1351" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1351" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1414" text-anchor="middle" font-size="28" fill="#493247">첫 정답자 확정 · 중복 보상 방지</text><path d="M650,1463 L650,1514" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1514" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1577" text-anchor="middle" font-size="28" fill="#493247">설정 확률에 따라 EXP 또는 복권 지급</text><path d="M650,1626 L650,1677" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1677" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1721" text-anchor="middle" font-size="28" fill="#493247">정답 성공 안내 또는</text><text x="650" y="1759" text-anchor="middle" font-size="28" fill="#493247">시간 만료 시 정답과 뜻 공개</text><path d="M650,1789 L650,1840" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1840" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1903" text-anchor="middle" font-size="28" fill="#493247">퀴즈 종료 · 다음 출제 주기 대기</text><rect x="70" y="2070" width="1460" height="112" rx="12" fill="#FFF8ED" stroke="#B59BAF" stroke-width="2"/><text x="800" y="2110" text-anchor="middle" font-size="24" fill="#493247">제한시간은 설정값을 따르며 최대 30분입니다. 시간 만료 공개에는 정답자 보상이 없습니다.</text><text x="800" y="2210" text-anchor="middle" font-size="23" fill="#493247">6 / 9  ·  마름모: 조건 판단  |  아래: 예  |  오른쪽: 아니요</text></g></svg>