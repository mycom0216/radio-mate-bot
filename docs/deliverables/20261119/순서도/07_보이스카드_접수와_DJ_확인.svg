" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1251" text-anchor="middle" font-size="28" fill="#493247">음성 파일과 메타데이터 저장</text><path d="M650,1300 L650,1351" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1351" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1414" text-anchor="middle" font-size="28" fill="#493247">DJ 계정 인증 후 음성 접수함 열기</text><path d="M650,1463 L650,1514" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1514" width="960" height="112" rx="12" fill="#FAF6FC" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1577" text-anchor="middle" font-size="28" fill="#493247">DJ가 음성 재생 · 읽음 상태 확인</text><path d="M650,1626 L650,1677" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><polygon points="650,1677 1130,1733.0 650,1789 170,1733.0" fill="#FFF0F7" stroke="#B59BAF" stroke-width="2"/><path d="M1130,1733 L1190,1733" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><text x="1165" y="1761" text-anchor="middle" font-size="24" fill="#493247">아니요</text><rect x="1190" y="1677" width="350" height="112" rx="12" fill="#F6F1F8" stroke="#B59BAF" stroke-width="2"/><text x="1365" y="1722" text-anchor="middle" font-size="23" fill="#493247">접수함에서 계속 보관</text><text x="610" y="1818" text-anchor="middle" font-size="24" fill="#493247">예</text><text x="650" y="1740" text-anchor="middle" font-size="28" fill="#493247">DJ가 삭제를 요청했는가?</text><path d="M650,1789 L650,1840" fill="none" stroke="#9D688D" stroke-width="3" marker-end="url(#arrow)"/><rect x="170" y="1840" width="960" height="112" rx="56.0" fill="#EAF7F0" stroke="#B59BAF" stroke-width="2"/><text x="650" y="1903" text-anchor="middle" font-size="28" fill="#493247">삭제 시 원본 파일과 DB 기록 정리</text><rect x="70" y="2070" width="1460" height="112" rx="12" fill="#FFF8ED" stroke="#B59BAF" stroke-width="2"/><text x="800" y="2110" text-anchor="middle" font-size="24" fill="#493247">스푼 앱 채팅창 안에 녹음 UI를 삽입하는 기능은 지원하지 않습니다. 다른 기기에서는 공개 HTTPS가 필요합니다.</text><text x="800" y="2210" text-anchor="middle" font-size="23" fill="#493247">7 / 9  ·  마름모: 조건 판단  |  아래: 예  |  오른쪽: 아니요</text></g></svg>