" fill="#A94778" font-weight="700">Users map</text><path d="M638 472H1052" stroke="#D4C5D0"/><text x="642" y="504" font-size="24" fill="#302632" font-weight="400">key = Spoon 사용자 ID</text><text x="642" y="535" font-size="24" fill="#302632" font-weight="400">EXP / PT / tickets / bag / buffs</text><text x="642" y="566" font-size="24" fill="#302632" font-weight="400">listeningMs / chatAffinityPoints</text><text x="642" y="597" font-size="24" fill="#302632" font-weight="400">keeps[] / keepHistory[]</text><text x="642" y="628" font-size="24" fill="#302632" font-weight="400">lastCommand / lastKeepCommand</text><rect x="1230" y="430" width="430" height="270" rx="18" fill="#FFF8FB" stroke="#D4C5D0" stroke-width="2"/><text x="1252" y="468" font-size="27" fill="#A94778" font-weight="700">Songs</text><path d="M1248 482H1642" stroke="#D4C5D0"/><text x="1252" y="514" font-size="24" fill="#302632" font-weight="400">id / user / name / title</text><text x="1252" y="545" font-size="24" fill="#302632" font-weight="400">videoId / url / order</text><text x="1252" y="576" font-size="24" fill="#302632" font-weight="400">대기·현재·이전·완료 상태</text><text x="1252" y="607" font-size="24" fill="#302632" font-weight="400">user → Users의 ID 참조</text><rect x="230" y="860" width="430" height="200" rx="18" fill="#FFF8FB" stroke="#D4C5D0" stroke-width="2"/><text x="252" y="898" font-size="27" fill="#A94778" font-weight="700">Keep item</text><path d="M248 912H642" stroke="#D4C5D0"/><text x="252" y="944" font-size="24" fill="#302632" font-weight="400">keeps[] = 보상명 문자열</text><text x="252" y="975" font-size="24" fill="#302632" font-weight="400">동일 이름은 수량으로 묶어 표시</text><text x="252" y="1006" font-size="24" fill="#302632" font-weight="400">매월 1일 KST 보유 초기화</text><rect x="1010" y="840" width="540" height="250" rx="18" fill="#FFF8FB" stroke="#D4C5D0" stroke-width="2"/><text x="1032" y="878" font-size="27" fill="#A94778" font-weight="700">Keep history</text><path d="M1028 892H1532" stroke="#D4C5D0"/><text x="1032" y="924" font-size="24" fill="#302632" font-weight="400">id / text / kind / time / actor</text><text x="1032" y="955" font-size="24" fill="#302632" font-weight="400">used → cancelled 사용 취소</text><text x="1032" y="986" font-size="24" fill="#302632" font-weight="400">cancelledAt / cancelledBy</text><text x="1032" y="1017" font-size="24" fill="#302632" font-weight="400">SQL 테이블이 아닌 사용자 내부 배열</text><text x="35" y="1160" font-size="25" fill="#A94778" font-weight="700">중요   Users·Songs·Keep은 논리 엔티티이며 별도 관계형 테이블이 아니다</text></g></svg>