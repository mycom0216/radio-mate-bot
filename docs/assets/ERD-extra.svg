<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="590" viewBox="0 0 1280 590"><rect width="1280" height="590" fill="#fffafd"/><style>text{font-family:'Malgun Gothic',sans-serif}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a56b8b"/></marker></defs><text x="35" y="35" font-size="19" fill="#7e4867">추가 테이블 물리 ERD · outbox · studio_sessions (초기 7개 이후 추가)</text><text x="35" y="68" font-size="15" fill="#855570">방송 데이터와 같은 studio.sqlite에 서버 시작 때 자동으로 만들어집니다.</text><path d="M340 200C415 200,415 200,490 200" fill="none" stroke="#b27b99" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="385" y="185" font-size="15" fill="#865b74">N : 1</text><path d="M940 200C870 200,870 200,800 200" fill="none" stroke="#b27b99" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="850" y="185" font-size="15" fill="#865b74">N : 1</text><g transform="translate(30 120)"><rect width="310" height="275" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">outbox</text><text x="18" y="80" font-size="15" fill="#62465a">id TEXT  PK (UUID)</text><text x="18" y="105" font-size="15" fill="#62465a">room · event_key TEXT  NN</text><text x="18" y="130" font-size="15" fill="#62465a">text TEXT  NN (최대 200자)</text><text x="18" y="155" font-size="15" fill="#62465a">created · due INTEGER  NN</text><text x="18" y="180" font-size="15" fill="#62465a">attempts INTEGER  NN</text><text x="18" y="205" font-size="15" fill="#62465a">status TEXT  NN</text><text x="18" y="230" font-size="15" fill="#62465a">UNIQUE(room, event_key)</text><text x="18" y="255" font-size="15" fill="#62465a">INDEX (room, status, due)</text></g><g transform="translate(490 120)"><rect width="310" height="150" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">rooms</text><text x="18" y="80" font-size="15" fill="#62465a">id TEXT  PK</text><text x="18" y="105" font-size="15" fill="#62465a">data TEXT  NOT NULL</text><text x="18" y="130" font-size="15" fill="#62465a">방송 전체 상태 JSON (3쪽)</text></g><g transform="translate(940 120)"><rect width="310" height="175" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">studio_sessions</text><text x="18" y="80" font-size="15" fill="#62465a">key TEXT  PK (쿠키 SHA-256)</text><text x="18" y="105" font-size="15" fill="#62465a">room TEXT  NN</text><text x="18" y="130" font-size="15" fill="#62465a">expires INTEGER  NN</text><text x="18" y="155" font-size="15" fill="#62465a">data TEXT  NN (AES-256-GCM)</text></g><text x="35" y="430" font-size="15" fill="#855570">outbox · 스푼 채팅 송신 대기열</text><text x="35" y="457" font-size="15" fill="#855570">같은 (room, event_key)는 한 번만 담김</text><text x="35" y="484" font-size="15" fill="#855570">결과가 불확실하면 자동 재전송 안 함</text><text x="490" y="430" font-size="15" fill="#855570">rooms 카드는 도면 연결용입니다.</text><text x="490" y="457" font-size="15" fill="#855570">컬럼 정의는 3쪽에 있습니다.</text><text x="945" y="430" font-size="15" fill="#855570">studio_sessions · DJ 웹 로그인 세션</text><text x="945" y="457" font-size="15" fill="#855570">쿠키는 SHA-256 해시로만 저장</text><text x="945" y="484" font-size="15" fill="#855570">공개 테스트 로그인은 메모리에만 보관</text><text x="35" y="535" font-size="16" fill="#7e4867">PK: 기본키 / NN: NOT NULL / N : 1: 여러 행이 한 방송을 가리킴</text><text x="35" y="565" font-size="15" fill="#7e4867">SQL FOREIGN KEY 선언 없음. room은 rooms.id를 값으로 가지는 애플리케이션 참조입니다.</text></svg>