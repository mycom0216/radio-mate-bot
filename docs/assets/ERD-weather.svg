<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790"><rect width="1280" height="790" fill="#fffafd"/><style>text{font-family:'Malgun Gothic',sans-serif}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#a56b8b"/></marker></defs><text x="35" y="35" font-size="19" fill="#7e4867">날씨 물리 ERD · weather_* 4개 테이블 (기상청 연동, 2026-11-19 추가)</text><text x="35" y="68" font-size="15" fill="#855570">방송 데이터와 같은 studio.sqlite에 서버 시작 때 자동으로 만들어집니다.</text><path d="M340 195C415 195,415 210,490 210" fill="none" stroke="#b27b99" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="385" y="180" font-size="15" fill="#865b74">N : 1</text><path d="M940 195C870 195,870 210,800 210" fill="none" stroke="#b27b99" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="850" y="180" font-size="15" fill="#865b74">N : 1</text><path d="M645 470C645 470,645 395,645 395" fill="none" stroke="#b27b99" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="662" y="440" font-size="15" fill="#865b74">N : 1 (키 값으로 참조)</text><g transform="translate(30 120)"><rect width="310" height="150" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">weather_alias</text><text x="18" y="80" font-size="15" fill="#62465a">alias TEXT  PK</text><text x="18" y="105" font-size="15" fill="#62465a">location TEXT  NN</text><text x="18" y="130" font-size="15" fill="#62465a">REFERENCES weather_location(id)</text></g><g transform="translate(490 120)"><rect width="310" height="275" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">weather_location</text><text x="18" y="80" font-size="15" fill="#62465a">id TEXT  PK (표시 이름)</text><text x="18" y="105" font-size="15" fill="#62465a">zone · kma_name TEXT  NN</text><text x="18" y="130" font-size="15" fill="#62465a">nx · ny INTEGER</text><text x="18" y="155" font-size="15" fill="#62465a">lat · lon REAL</text><text x="18" y="180" font-size="15" fill="#62465a">mid_land · mid_temp TEXT</text><text x="18" y="205" font-size="15" fill="#62465a">sort INTEGER  NN DEFAULT 100</text><text x="18" y="230" font-size="15" fill="#62465a">national · enabled · managed</text><text x="18" y="255" font-size="15" fill="#62465a">INTEGER  NN (0 또는 1)</text></g><g transform="translate(940 120)"><rect width="310" height="225" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">weather_daily</text><text x="18" y="80" font-size="15" fill="#62465a">location · date TEXT  PK(1,2)</text><text x="18" y="105" font-size="15" fill="#62465a">min · max REAL</text><text x="18" y="130" font-size="15" fill="#62465a">rain INTEGER · condition TEXT</text><text x="18" y="155" font-size="15" fill="#62465a">hours INTEGER  NN DEFAULT 0</text><text x="18" y="180" font-size="15" fill="#62465a">source TEXT  NN</text><text x="18" y="205" font-size="15" fill="#62465a">updated INTEGER  NN</text></g><g transform="translate(490 470)"><rect width="310" height="175" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">weather_snapshot</text><text x="18" y="80" font-size="15" fill="#62465a">product · key TEXT  PK(1,2)</text><text x="18" y="105" font-size="15" fill="#62465a">issued TEXT  NN</text><text x="18" y="130" font-size="15" fill="#62465a">fetched INTEGER  NN</text><text x="18" y="155" font-size="15" fill="#62465a">payload TEXT  NN (파싱된 JSON)</text></g><text x="35" y="340" font-size="15" fill="#855570">시드: 전국 17곳 (national=1)</text><text x="35" y="367" font-size="15" fill="#855570">추가 4곳: 목포 · 여수 · 순천 · 서귀포</text><text x="35" y="394" font-size="15" fill="#855570">managed=1 행은 서버를 시작할 때</text><text x="35" y="421" font-size="15" fill="#855570">코드의 기준값으로 갱신됩니다.</text><text x="35" y="448" font-size="15" fill="#855570">직접 고친 행은 managed=0으로 둡니다.</text><text x="945" y="400" font-size="15" fill="#855570">weather_daily</text><text x="945" y="427" font-size="15" fill="#855570">지난 날짜 표시와 오늘 최저기온 보존</text><text x="945" y="454" font-size="15" fill="#855570">400일이 지난 행은 삭제</text><text x="945" y="481" font-size="15" fill="#855570">weather_snapshot</text><text x="945" y="508" font-size="15" fill="#855570">지역당 최신 1건 · 30분 캐시 · 12시간 폴백</text><text x="35" y="700" font-size="16" fill="#7e4867">PK: 기본키 / NN: NOT NULL / N : 1: 여러 행이 한 지역을 가리킴</text><text x="35" y="730" font-size="15" fill="#7e4867">weather_alias · weather_daily의 REFERENCES는 선언만 되어 있고 SQLite 외래 키 강제(PRAGMA foreign_keys)는 꺼져 있습니다.</text><text x="35" y="760" font-size="15" fill="#7e4867">weather_snapshot.key는 선언 없는 논리 참조입니다. 기상청 서비스키는 DB에 저장하지 않습니다.</text></svg>