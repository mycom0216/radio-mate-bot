" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">Song</text><text x="18" y="80" font-size="15" fill="#62465a">id · user · name · title</text><text x="18" y="105" font-size="15" fill="#62465a">videoId: string 또는 null</text><text x="18" y="130" font-size="15" fill="#62465a">songs[] 대기 / current 현재</text><text x="18" y="155" font-size="15" fill="#62465a">previous 이전</text></g><g transform="translate(50 350)"><rect width="310" height="175" rx="16" fill="#fffdfd" stroke="#c796b1" stroke-width="2"/><path d="M16 0h278a16 16 0 0 1 16 16v34H0V16A16 16 0 0 1 16 0" fill="#f5dfeb"/><text x="18" y="33" font-size="22" font-weight="700" fill="#7c3f61">Settings</text><text x="18" y="80" font-size="15" fill="#62465a">cooldown · responseGap · quiet</text><text x="18" y="105" font-size="15" fill="#62465a">fishing · odd · roulette · quiz</text><text x="18" y="130" font-size="15" fill="#62465a">fish[] · items[] · announcements[]</text><text x="18" y="155" font-size="15" fill="#62465a">autoReplies[] · quizQuestions[]</text></g><text x="35" y="620" font-size="15" fill="#7e4867">객체 관계를 설명하는 개념도입니다. SQL 정규화 설계와 구분해 사용하세요.</text></svg>