plugins { id 'com.android.application' }

def serverUrl = providers.gradleProperty('serverUrl').getOrElse('https://radiomate-mycom0216.gallanttamarind4.chatgpt.site')
def endpoint = new URI(serverUrl)
if (endpoint.scheme != 'https' || !endpoint.host || endpoint.rawUserInfo || endpoint.rawQuery || endpoint.rawFragment || !(endpoint.path in ['', '/'])) {
    throw new GradleException('serverUrl must be an HTTPS origin, without path, credentials, query or fragment')
}
def signingFile = rootProject.file('signing.properties')
def signing = new Properties()
if (signingFile.exists()) signingFile.withReader('UTF-8') { signing.load(it) }
android {
    namespace 'net.radiomate.app'
    compileSdk 36
    defaultConfig {
        applicationId 'net.radiomate.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'SERVER_URL', '"' + serverUrl.replaceAll('/$', '') + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.exists()) {
            release {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-preview' }
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
}
